[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibes"
authors = [
    {name = "Francois Kamper", email = "francois.kamper@epfl.ch"},
    {name = "Ekaterina Krymova", email = "ekrymova@ethz.ch"},
    {name = "Satoshi Takahama", email = "satoshi.takahama@epfl.ch"},
]
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy~=2.2.1",
    "cvxpy~=1.5.3",
    "scikit-learn~=1.5.2",
    "pandas~=2.2.3",
    "matplotlib~=3.9.2",
    "scipy~=1.14.1",
    "ipykernel~=6.29.2",
    "seaborn~=0.13.2",
    "pyarrow~=23.0.1",
    "tqdm~=4.67.3",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "vibes.__version__"}

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "W605",   # pycodestyle: invalid-escape-sequence
    "S102",   # flake8-bandit: exec-builtin
    "INP",    # flake8-no-pep420
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "NPY002", # numpy-legacy-random
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]
"[!t][!e][!s][!t][!s]*/**" = ["PT"]